<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="DeltaForge">
<title>DeltaForge</title>
<defs>
  <pattern id="dotsD" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="2.2" height="2.2" fill="#121826" opacity="0.09"/></pattern>
  <pattern id="scanD" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#121826" opacity="0.05"/></pattern>
  <clipPath id="qcD"><rect x="6" y="6" width="1180" height="250" rx="18"/></clipPath>
  <clipPath id="scD"><rect x="0" y="0" width="396" height="206" rx="12"/></clipPath>
  <style>
  .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace;font-weight:700}
  .disp{font-family:'Arial Black','Segoe UI Black','Helvetica Neue',Impact,Arial,sans-serif;font-weight:900}
  .sans{font-family:'Segoe UI','Helvetica Neue',system-ui,-apple-system,Arial,sans-serif}
  .blink{animation:blink 1s steps(1,end) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .dash{animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}
  </style>
</defs>
<rect x="14" y="14" width="1180" height="250" rx="18" fill="#0ea5e9"/><rect x="6" y="6" width="1180" height="250" rx="18" fill="#fff" stroke="#121826" stroke-width="3"/>
<g clip-path="url(#qcD)"><rect x="6" y="6" width="740" height="250" fill="url(#dotsD)"/></g>

<g><rect x="40" y="30" width="112" height="26" rx="6" fill="#0ea5e9" stroke="#121826" stroke-width="2.5"/><text x="96.75" y="47.3" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#fff">MAIN QUEST</text></g>
<g><rect x="162" y="30" width="49" height="26" rx="6" fill="#fff" stroke="#121826" stroke-width="2.5"/><text x="187.25" y="47.3" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#121826">#02</text></g>
<text x="227" y="48" class="mono" font-size="11" letter-spacing="2.2" fill="#8a94a6">&#9656; PROCEDURAL 3D CAD</text>
<text x="740" y="48" text-anchor="end" class="mono" font-size="11" letter-spacing="2" fill="#8a94a6">DIFFICULTY <tspan font-size="15"><tspan fill="#0ea5e9">&#9733;&#9733;&#9733;&#9733;&#9733;</tspan></tspan></text>

<text x="44" y="116" class="disp" font-size="50" letter-spacing="-1" fill="#0ea5e9">DeltaForge</text>
<text x="40" y="112" class="disp" font-size="50" letter-spacing="-1" fill="#121826">DeltaForge</text>
<g class="sans" font-size="16.5" fill="#4b5563">
  <text x="42" y="148">Precision-Safe RLVR &amp; Spatial &lt;think&gt; Blueprints for 9B CAD.</text>
  <text x="42" y="171">Single RTX 3090 &#183; 92.3% pass@1 / 100% pass@3 in Blender 5.2.</text>
</g>
<text x="42" y="214" class="mono" font-size="12" letter-spacing="2" fill="#121826">LOOT &#9656;</text>
<g><rect x="112" y="196" width="94" height="26" rx="6" fill="#e0f2fe" stroke="#121826" stroke-width="2.5"/><text x="159" y="213.0" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.1" fill="#121826">QWEN3.5-9B</text></g>
<g><rect x="214" y="196" width="88" height="26" rx="6" fill="#e0f2fe" stroke="#121826" stroke-width="2.5"/><text x="258" y="213.0" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.1" fill="#121826">BF16 LORA</text></g>
<g><rect x="310" y="196" width="82" height="26" rx="6" fill="#e0f2fe" stroke="#121826" stroke-width="2.5"/><text x="351" y="213.0" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.1" fill="#121826">DPO/GRPO</text></g>
<g><rect x="400" y="196" width="102" height="26" rx="6" fill="#e0f2fe" stroke="#121826" stroke-width="2.5"/><text x="451" y="213.0" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.1" fill="#121826">BLENDER 5.2</text></g>
<g><rect x="510" y="196" width="90" height="26" rx="6" fill="#e0f2fe" stroke="#121826" stroke-width="2.5"/><text x="555" y="213.0" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.1" fill="#121826">LLAMA.CPP</text></g>

<!-- screen -->
<g transform="translate(770 28)">
  <g clip-path="url(#scD)">
    <rect width="396" height="206" fill="#0f172a"/>
    <!-- perspective floor grid -->
    <g stroke="#1e293b" stroke-width="1.5">
      <line x1="20" y1="168" x2="376" y2="168"/>
      <line x1="50" y1="150" x2="346" y2="150"/>
      <line x1="80" y1="134" x2="316" y2="134"/>
      <line x1="120" y1="134" x2="60" y2="186"/>
      <line x1="198" y1="134" x2="198" y2="186"/>
      <line x1="276" y1="134" x2="336" y2="186"/>
    </g>
    <!-- glowing isometric CAD assembly -->
    <g transform="translate(198 104)">
      <!-- pedestal -->
      <polygon points="-58,36 0,58 58,36 0,14" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
      <!-- main cube body -->
      <polygon points="-38,-14 0,4 0,40 -38,22" fill="#0284c7" stroke="#7dd3fc" stroke-width="2"/>
      <polygon points="38,-14 0,4 0,40 38,22" fill="#0369a1" stroke="#7dd3fc" stroke-width="2"/>
      <polygon points="-38,-14 0,-32 38,-14 0,4" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2"/>
      <!-- top turret / detail -->
      <polygon points="-18,-26 0,-18 18,-26 0,-34" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
      <line x1="0" y1="-34" x2="0" y2="-56" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 3" class="dash"/>
      <circle cx="0" cy="-58" r="4" fill="#fbbf24"><animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <rect y="186" width="396" height="20" fill="#1e293b"/>
    <text x="384" y="30" text-anchor="end" class="mono" font-size="10" letter-spacing="1.5" fill="#10b981">PASS@1 92.3%</text>
    <text x="384" y="44" text-anchor="end" class="mono" font-size="9.5" letter-spacing="1.2" fill="#38bdf8">CONN 0.97</text>
    <text x="10" y="199" class="mono" font-size="9.5" letter-spacing="1.5" fill="#e2e8f0">BPY &gt; BLENDER 5.2 SANDBOX</text>
    <rect width="396" height="206" fill="url(#scanD)"/>
  </g>
  <rect width="396" height="206" rx="12" fill="none" stroke="#121826" stroke-width="3"/>
  <g><rect x="12" y="12" width="122" height="22" rx="6" fill="#fff" stroke="#121826" stroke-width="2.5"/><text x="73" y="26.6" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.4" fill="#121826"><tspan class="blink" fill="#10b981">&#9679;</tspan> FORGING 3D</text></g>
</g>
</svg>
