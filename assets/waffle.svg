<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" role="img" aria-label="W.A.F.F.L.E.">
<title>W.A.F.F.L.E.</title>
<defs>
  <linearGradient id="cbgW" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0f1b"/>
    <stop offset="0.6" stop-color="#080c16"/>
    <stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <radialGradient id="cglowW" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="clineW" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.4" stop-color="#22d3ee"/>
    <stop offset="0.7" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    <animate attributeName="x1" values="-0.8;0.2" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.8;1.8" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ctitleW" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <clipPath id="cclipW"><rect width="1200" height="228" rx="18"/></clipPath>
  <clipPath id="artclipW"><rect x="700" y="0" width="500" height="228"/></clipPath>
  <style>
    .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',monospace; }
    .sans { font-family: 'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .hz { animation: hz 5s ease-in-out infinite; }
    .spin { animation: spin 14s linear infinite; transform-origin: 950px 114px; }
    .spin-r { animation: spinR 22s linear infinite; transform-origin: 950px 114px; }
    .spin-slow { animation: spin 40s linear infinite; transform-origin: 950px 114px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes spinR { to { transform: rotate(-360deg) } }
    @keyframes hz { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    
    .blip { animation: blip 3s ease-out infinite; }
    .blip2 { animation: blip 3s 1s ease-out infinite; }
    .blip3 { animation: blip 3s 2s ease-out infinite; }
    @keyframes blip { 0%,100% { opacity:.15 } 15% { opacity:1 } 60% { opacity:.2 } }
    .flight { stroke-dasharray: 6 7; animation: dash 2.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -26 } }
  
  </style>
</defs>
<g clip-path="url(#cclipW)">
  <rect width="1200" height="228" fill="url(#cbgW)"/>
  <ellipse cx="1010" cy="120" rx="300" ry="200" fill="url(#cglowW)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 0V228"/><path d="M48 0V228"/><path d="M96 0V228"/><path d="M144 0V228"/><path d="M192 0V228"/><path d="M240 0V228"/><path d="M288 0V228"/><path d="M336 0V228"/><path d="M384 0V228"/><path d="M432 0V228"/><path d="M480 0V228"/><path d="M528 0V228"/><path d="M576 0V228"/><path d="M624 0V228"/><path d="M672 0V228"/><path d="M720 0V228"/><path d="M768 0V228"/><path d="M816 0V228"/><path d="M864 0V228"/><path d="M912 0V228"/><path d="M960 0V228"/><path d="M1008 0V228"/><path d="M1056 0V228"/><path d="M1104 0V228"/><path d="M1152 0V228"/>
    <path d="M0 0H1200"/><path d="M0 48H1200"/><path d="M0 96H1200"/><path d="M0 144H1200"/><path d="M0 192H1200"/>
  </g>

