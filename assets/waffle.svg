        <path d="M950 114 L950 18" stroke="#22d3ee" stroke-width="1.6" opacity="0.65"/>
      </g>
      <g class="spin-r" fill="none" stroke="#8b5cf6" stroke-width="1.1" opacity="0.45">
        <circle cx="950" cy="114" r="96" stroke-dasharray="3 12"/>
      </g>

      <g>
        <circle class="blip" cx="1004" cy="86" r="4.5" fill="#ffb347"/>
        <circle class="blip" cx="1004" cy="86" r="11" fill="none" stroke="#ffb347" stroke-width="1"/>
        <circle class="blip2" cx="896" cy="146" r="3.6" fill="#22d3ee"/>
        <circle class="blip2" cx="896" cy="146" r="9" fill="none" stroke="#22d3ee" stroke-width="1"/>
        <circle class="blip3" cx="986" cy="170" r="3.2" fill="#8b5cf6"/>
        <circle class="blip3" cx="986" cy="170" r="8" fill="none" stroke="#8b5cf6" stroke-width="1"/>
      </g>

      <g>
        <path class="flight" d="M848 176 C 892 120, 940 150, 986 96 S 1058 60, 1082 78" fill="none" stroke="#ffb347" stroke-width="1.4" opacity="0.8"/>
        <g>
          <circle r="2.6" fill="#ffb347"/>
          <animateMotion dur="6s" repeatCount="indefinite" path="M848 176 C 892 120, 940 150, 986 96 S 1058 60, 1082 78"/>
        </g>
      </g>

      <g class="mono" font-size="8.5" fill="#7f90a8" letter-spacing="1.4" opacity="0.85">
        <text x="1074" y="200">PPO &#183; WAYPOINT 04</text>
        <text x="1074" y="212" fill="#22d3ee">AUTONOMOUS</text>
        <text x="848" y="34">RANGE 1.2 KM</text>
      </g>
    </g>
  </g>
  <rect x="700" y="0" width="1" height="228" fill="#ffffff" opacity="0.05"/>
  <g opacity="0.55"><rect x="700" y="0" width="500" height="228" fill="url(#cglowW)"/></g>

  <!-- left content -->
  <g class="mono" font-size="10.5" letter-spacing="2.6">
    <text x="44" y="46" fill="#22d3ee">01</text>
    <text x="76" y="46" fill="#7f90a8">/ AUTONOMOUS FLEET</text>
    <circle class="hz" cx="1108" cy="42" r="3.4" fill="#22d3ee"/>
    <text x="1120" y="46" fill="#8fa1b8" font-size="9.5">IN FLIGHT</text>
  </g>

  <text class="sans" x="42" y="118" font-size="46" font-weight="800" letter-spacing="-1.4" fill="url(#ctitleW)">W.A.F.F.L.E.</text>
  <g class="sans" font-size="15.5" fill="#9fb0c6">
    <text x="44" y="150">Wireless Autonomous Flying Fleet for Life Emergencies.</text><text x="44" y="172">Android companion computer &#183; PX4 &#183; PPO pathfinding.</text>
  </g>

  <g class="mono" font-size="10" letter-spacing="1.4">
    <g><rect x="44" y="188" width="45.5" height="23" rx="11.5" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.28"/><text x="66.75" y="203.5" text-anchor="middle" fill="#b9c8dc">PX4</text></g><g><rect x="98.5" y="188" width="71.5" height="23" rx="11.5" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.28"/><text x="134.25" y="203.5" text-anchor="middle" fill="#b9c8dc">DJI SDK</text></g><g><rect x="179" y="188" width="78" height="23" rx="11.5" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.28"/><text x="218" y="203.5" text-anchor="middle" fill="#b9c8dc">PPO / RL</text></g><g><rect x="266" y="188" width="65" height="23" rx="11.5" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.28"/><text x="298.5" y="203.5" text-anchor="middle" fill="#b9c8dc">KOTLIN</text></g><g><rect x="340" y="188" width="78" height="23" rx="11.5" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.28"/><text x="379" y="203.5" text-anchor="middle" fill="#b9c8dc">MAPLIBRE</text></g>
  </g>

  <rect x="0" y="0.5" width="1200" height="1" fill="url(#clineW)"/>
  <rect x="0" y="227" width="1200" height="1" fill="#ffffff" opacity="0.06"/>
