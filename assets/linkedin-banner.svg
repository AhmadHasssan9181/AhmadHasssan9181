  <style>
    .mono{font-family:'Consolas','JetBrains Mono','Cascadia Code','SF Mono',Menlo,monospace;font-weight:700}
    .disp{font-family:'Arial Black','Segoe UI Black','Helvetica Neue',Impact,Arial,sans-serif;font-weight:900}
