<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <rect x="2" y="2" width="4" height="4" fill="#121826" opacity="0.09"/>
  </pattern>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="2" fill="#121826" opacity="0.04"/>
  </pattern>
  <style>
    .mono{font-family:'Consolas','JetBrains Mono','Cascadia Code',monospace;font-weight:700}
    .disp{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  </style>
</defs>

<!-- Full-bleed background so GitHub/LinkedIn circle crop has zero outer gap -->
