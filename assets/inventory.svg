  .sans{font-family:'Segoe UI','Helvetica Neue',system-ui,-apple-system,Arial,sans-serif}
  .blink{animation:blink 1s steps(1,end) infinite}
  .blink-slow{animation:blink 1.6s steps(1,end) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

    .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .shine{animation:shine 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes shine{0%,70%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(320px)}}
  </style>
