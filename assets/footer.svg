    .eq { animation: eq 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes eq { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
    .dash { stroke-dasharray: 3 9; animation: dash 3s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -48 } }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:.35 } 50% { opacity:.75 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
